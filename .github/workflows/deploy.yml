name: deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect WireGuard
        env:
          WIREGUARD_CONF: ${{ secrets.WIREGUARD_CONF }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wireguard-tools
          sudo ln -sf "$(command -v resolvectl)" /usr/local/bin/resolvconf
          # Ubuntu 26.04 confines wg-quick to /etc/wireguard via AppArmor.
          sudo install -d -m 700 /etc/wireguard
          printf '%s\n' "$WIREGUARD_CONF" | sudo install -m 600 /dev/stdin /etc/wireguard/wg0.conf
          sudo wg-quick up wg0

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.DEPLOY_SECRET_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.SSH_HOST }}
          if_key_exists: fail
      - name: Adding Known Hosts
        run: ssh-keyscan -T 20 -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Deploy with rsync
        run: rsync -avz --delete ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/mtg-starting-hand-emulator/
      - name: Build and start services
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.DEPLOY_SECRET_KEY }}
          port: 22
          script: |
            cd mtg-starting-hand-emulator
            echo "MTG_DOMAIN=${{ secrets.MTG_DOMAIN }}" > .env
            docker compose up -d --build --remove-orphans

      - name: Disconnect WireGuard
        if: always()
        run: |
          if sudo test -f /etc/wireguard/wg0.conf; then
            sudo wg-quick down wg0 || true
            sudo rm -f /etc/wireguard/wg0.conf
          fi
