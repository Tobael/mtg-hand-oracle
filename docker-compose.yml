services:
  # ─── Web Frontend ───
  web:
    container_name: mtg-hand-oracle
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - external_network
    # The homelab Anubis router is the only public entrypoint. Never expose a
    # lower-priority backend router when Anubis stops or becomes unhealthy.
    labels:
      - traefik.enable=false

networks:
  external_network:
    external: true
    name: external_network